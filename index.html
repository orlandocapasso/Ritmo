function escapeHTML(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeRegex(str) {
  return String(str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ============================================================
// DATE & CURRENCY HELPERS
// ============================================================
function toISODate(d) {
  const dt = d instanceof Date ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function formatDateIT(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}
function formatFullDateHeader(d) {
  return d.toLocaleDateString(state.lang === 'en' ? 'en-US' : 'it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formatCurrency(val) {
  const num = Number(val) || 0;
  return num.toLocaleString(state.lang === 'en' ? 'en-US' : 'it-IT', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
}
function formatHours(h) { return `${Math.round((Number(h)||0)*10)/10}h`; }
function calcShiftDurationHours(s, e) {
  if (!s || !e) return 0;
  const [sh,sm] = s.split(':').map(Number), [eh,em] = e.split(':').map(Number);
  if ([sh,sm,eh,em].some(Number.isNaN)) return 0;
  let start = sh*60+sm, end = eh*60+em;
  if (end < start) end += 1440;
  return Math.max(0, (end-start)/60);
}
function getShiftType(id) { return state.shiftTypes.find(s => s.id === id) || state.shiftTypes[state.shiftTypes.length-1]; }

function isIncomeActiveInMonth(inc, year, m) {
  if (!inc?.date) return false;
  const [iy,im] = inc.date.split('-').map(Number);
  if (inc.recurringMonthly) return year*12+m >= iy*12+(im-1);
  return iy===year && (im-1)===m;
}
function isExpenseActiveInMonth(exp, year, m) {
  if (!exp?.date) return false;
  const [ey,em] = exp.date.split('-').map(Number);
  if (exp.recurringMonthly) return year*12+m >= ey*12+(em-1);
  return ey===year && (em-1)===m;
}
function getSubscriptionMonthlyEquivalent(sub) {
  if (!sub || sub.status !== 'active') return 0;
  const a = Number(sub.amount)||0;
  if (sub.frequency === 'yearly') return a/12;
  if (sub.frequency === 'quarterly') return a/3;
  if (sub.frequency === 'weekly') return (a*52)/12;
  return a;
}
function getAnnualIncomeTotal(year) {
  let t = 0;
  for (let m=0; m<12; m++) state.incomes.forEach(i => { if (isIncomeActiveInMonth(i,year,m)) t += Number(i.amount)||0; });
  return t;
}
function getAnnualExpensesTotal(year) {
  let t = 0;
  for (let m=0; m<12; m++) state.expenses.forEach(e => { if (isExpenseActiveInMonth(e,year,m)) t += Number(e.amount)||0; });
  return t;
}
function getMonthMetrics(year, m) {
  const prefix = `${year}-${String(m+1).padStart(2,'0')}`;
  let income=0; state.incomes.forEach(i => { if(isIncomeActiveInMonth(i,year,m)) income += Number(i.amount)||0; });
  let expenses=0, expensesCount=0;
  state.expenses.forEach(e => {
    if(isExpenseActiveInMonth(e,year,m)) expenses += Number(e.amount)||0;
    if(e.date?.startsWith(prefix)) expensesCount++;
  });
  const activeSubs = state.subscriptions.filter(s => s.status==='active');
  const subscriptionsMonthly = activeSubs.reduce((a,s) => a+getSubscriptionMonthlyEquivalent(s), 0);
  const monthShifts = state.shifts.filter(s => s.date?.startsWith(prefix));
  let workedHours=0, restDays=0, overtimeHours=0;
  monthShifts.forEach(s => {
    if (s.typeId==='rest') restDays++;
    else workedHours += calcShiftDurationHours(s.start, s.end);
    if (s.typeId==='overtime') overtimeHours += calcShiftDurationHours(s.start, s.end);
  });
  state.absences.forEach(ab => { if(ab.category==='overtime' && ab.startDate?.startsWith(prefix)) overtimeHours += Number(ab.hours)||0; });
  const balance = income - expenses - subscriptionsMonthly;
  const spentPct = income > 0 ? Math.min(100, Math.round(((expenses+subscriptionsMonthly)/income)*100)) : 0;
  return { income, expenses, expensesCount, subscriptionsMonthly, activeSubsCount:activeSubs.length, workedHours, overtimeHours, restDays, shiftsCount:monthShifts.length, balance, spentPct };
}

function openActivityModal() {
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-bold text-white">Attività</h3>
      <button onclick="closeModal()" class="text-[#8892a4] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form onsubmit="saveActivityForm(event)" class="flex gap-2 mb-4">
      <input name="title" type="text" required placeholder="Nuova attività..." class="flex-1 px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" />
      <input name="date" type="date" class="px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" />
      <button type="submit" class="lime-btn px-4 py-2 rounded-xl text-xs">${t('addBtn')}</button>
    </form>
    <div class="space-y-2 max-h-64 overflow-y-auto" id="activity-list">
      ${state.activities.length===0 ? `<div class="text-xs text-[#8892a4]">Nessuna attività.</div>` :
        state.activities.map(act=>`<div class="flex items-center justify-between p-2.5 rounded-xl bg-[#11151d] border border-[#232936] text-xs gap-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" ${act.done?'checked':''} onchange="toggleActivityDone('${act.id}')" class="accent-[#d4f824]" />
            <span class="${act.done?'line-through text-[#8892a4]':'text-white'}">${escapeHTML(act.title)}</span>
          </label>
          <div class="flex items-center gap-1.5 shrink-0">
            ${act.date?`<span class="text-[#8892a4]">${formatDateIT(act.date)}</span>`:''}
            <button onclick="deleteActivity('${act.id}')" class="text-rose-400 hover:text-rose-300">${t('deleteBtn')}</button>
          </div>
        </div>`).join('')}
    </div>
  `);
}
function saveActivityForm(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  state.activities.push({ id:'act_'+Date.now(), title:(fd.get('title')||'').trim(), date:fd.get('date')||'', done:false });
  saveState(); openActivityModal();
}
function toggleActivityDone(id) {
  const act = state.activities.find(a => a.id===id);
  if (act) { act.done = !act.done; saveState(); }
  if (document.getElementById('activity-list')) { openActivityModal(); } else { renderCurrentView(); }
}
function deleteActivity(id) {
  state.activities = state.activities.filter(a => a.id!==id);
  saveState(); openActivityModal();
}

function getAbsencesForDate(isoDate) {
  return state.absences.filter(ab => { if(!ab.startDate) return false; return isoDate>=ab.startDate && isoDate<=(ab.endDate||ab.startDate); });
}
function getAbsenceBadgeStyle(cat) {
  if(cat==='sick') return 'bg-rose-500/20 text-rose-200 border border-rose-500/40';
  if(cat==='permit') return 'bg-amber-500/20 text-amber-200 border border-amber-500/40';
  if(cat==='overtime') return 'bg-[#d4f824]/20 text-[#d4f824] border border-[#d4f824]/40';
  return 'bg-teal-500/20 text-teal-200 border border-teal-500/40';
}

function renderCalendarView() {
  const year = calendarCursorDate.getFullYear(), month = calendarCursorDate.getMonth();
  const monthTitle = calendarCursorDate.toLocaleDateString(state.lang==='en'?'en-US':'it-IT',{month:'long',year:'numeric'});
  const dayHeaders = state.lang==='en'?['MON','TUE','WED','THU','FRI','SAT','SUN']:['LUN','MAR','MER','GIO','VEN','SAB','DOM'];
  let gridHtml = '';

  if (calendarViewMode==='month') {
    const first = new Date(year,month,1), offset=(first.getDay()+6)%7, daysInMonth=new Date(year,month+1,0).getDate(), todayISO=toISODate(new Date());
    const cells=[];
    for(let i=0;i<offset;i++) cells.push(`<div class="min-h-[84px] sm:min-h-[104px] rounded-xl bg-[#10141c]/50 border border-[#1b202b]/60 p-1.5"></div>`);
    for(let d=1;d<=daysInMonth;d++){
      const iso=toISODate(new Date(year,month,d)), isToday=iso===todayISO;
      const ds=state.shifts.filter(s=>s.date===iso), da=getAbsencesForDate(iso);
      cells.push(`<div onclick="openShiftModal(null,'${iso}')" class="min-h-[84px] sm:min-h-[104px] rounded-xl bg-[#111620] hover:bg-[#161c28] border ${isToday?'border-[#d4f824]':'border-[#222938]'} p-1.5 sm:p-2 cursor-pointer flex flex-col justify-between transition-colors">
        <div class="flex items-center justify-between"><span class="text-xs font-semibold ${isToday?'text-[#d4f824]':'text-slate-300'}">${d}</span>${(ds.length+da.length)>0?`<span class="text-[10px] text-[#8892a4]">${ds.length+da.length}</span>`:''}</div>
        <div class="space-y-1 mt-1 overflow-hidden">
          ${ds.slice(0,2).map(s=>{const st=getShiftType(s.typeId);return`<div onclick="event.stopPropagation();openShiftModal('${s.id}')" class="px-1.5 py-0.5 rounded text-[10px] font-semibold truncate text-[#0d0f14]" style="background:${s.color||st.color}">${s.start?s.start+' ':''}${escapeHTML(st.label)}</div>`}).join('')}
          ${da.slice(0,2).map(ab=>`<div onclick="event.stopPropagation();navigate('assenze')" class="px-1.5 py-0.5 rounded text-[10px] font-semibold truncate ${getAbsenceBadgeStyle(ab.category)}">${escapeHTML(ab.type)}</div>`).join('')}
          ${(ds.length+da.length)>4?`<div class="text-[10px] text-[#8892a4]">+${(ds.length+da.length)-4}</div>`:''}
        </div>
      </div>`);
    }
    gridHtml=`<div class="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 text-center">${dayHeaders.map(h=>`<div class="text-[10px] sm:text-[11px] font-semibold tracking-wider text-[#8892a4] py-1">${h}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1.5 sm:gap-2">${cells.join('')}</div>`;
  } else if (calendarViewMode==='week') {
    const curr=new Date(calendarCursorDate), diff=(curr.getDay()+6)%7, mon=new Date(curr.getFullYear(),curr.getMonth(),curr.getDate()-diff), todayISO=toISODate(new Date());
    gridHtml=`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-2.5">${Array.from({length:7},(_,i)=>{
      const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i), iso=toISODate(d), isToday=iso===todayISO;
      const ds=state.shifts.filter(s=>s.date===iso), da=getAbsencesForDate(iso);
      return `<div onclick="openShiftModal(null,'${iso}')" class="min-h-[160px] rounded-xl bg-[#111620] hover:bg-[#161c28] border ${isToday?'border-[#d4f824]':'border-[#222938]'} p-2.5 cursor-pointer space-y-2">
        <div class="flex items-center justify-between border-b border-[#222938] pb-1.5"><span class="text-[10px] font-bold text-[#8892a4]">${dayHeaders[i]}</span><span class="text-xs font-bold ${isToday?'text-[#d4f824]':'text-white'}">${d.getDate()}/${d.getMonth()+1}</span></div>
        <div class="space-y-1.5">
          ${ds.map(s=>{const st=getShiftType(s.typeId);return`<div onclick="event.stopPropagation();openShiftModal('${s.id}')" class="p-1.5 rounded-lg text-[11px] font-semibold text-[#0d0f14]" style="background:${s.color||st.color}"><div>${escapeHTML(st.label)}</div><div class="text-[10px] opacity-85">${s.start||''} ${s.end?'– '+s.end:''}</div></div>`}).join('')}
          ${da.map(ab=>`<div onclick="event.stopPropagation();navigate('assenze')" class="p-1.5 rounded-lg text-[11px] font-semibold ${getAbsenceBadgeStyle(ab.category)}"><div>${escapeHTML(ab.type)}</div></div>`).join('')}
        </div>
      </div>`;
    }).join('')}</div>`;
  } else {
    const iso=toISODate(calendarCursorDate), ds=state.shifts.filter(s=>s.date===iso), da=getAbsencesForDate(iso);
    gridHtml=`<div class="space-y-3">
      <div class="flex items-center justify-between"><div class="text-sm font-semibold text-white">${formatDateIT(iso)}</div><button onclick="openShiftModal(null,'${iso}')" class="lime-btn px-3 py-1.5 rounded-xl text-xs">${t('addShiftCta')}</button></div>
      ${ds.length===0&&da.length===0?`<div class="dashed-empty py-10 text-center text-sm text-[#8892a4]">${t('noShiftDay')}</div>`:`<div class="space-y-2">
        ${ds.map(s=>{const st=getShiftType(s.typeId);return`<div onclick="openShiftModal('${s.id}')" class="p-3.5 rounded-xl bg-[#111620] border border-[#232936] hover:border-[#374156] cursor-pointer flex items-center justify-between"><div class="flex items-center gap-3"><span class="w-3 h-3 rounded-full" style="background:${s.color||st.color}"></span><div><div class="text-sm font-bold text-white">${escapeHTML(st.label)}</div><div class="text-xs text-[#8892a4]">${s.start||'—'} – ${s.end||'—'}</div></div></div><span class="text-xs font-semibold text-[#d4f824]">${formatHours(calcShiftDurationHours(s.start,s.end))}</span></div>`}).join('')}
        ${da.map(ab=>`<div onclick="navigate('assenze')" class="p-3.5 rounded-xl bg-[#111620] border border-[#232936] hover:border-[#374156] cursor-pointer"><span class="px-2 py-0.5 rounded text-xs font-semibold ${getAbsenceBadgeStyle(ab.category)}">${escapeHTML(ab.type)}</span></div>`).join('')}
      </div>`}
    </div>`;
  }

  return `<div class="space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div><div class="text-[11px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('calEyebrow')}</div><h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${t('calTitle')}</h1></div>
      <div class="flex items-center gap-2">
        <button onclick="navigate('importa')" class="px-3.5 py-2.5 rounded-xl bg-[#151921] hover:bg-[#1c222d] border border-[#232936] text-xs sm:text-sm font-semibold text-white inline-flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4 text-[#d4f824]"></i><span>${t('importBtn')}</span></button>
        <button onclick="openShiftModal(null,'${toISODate(calendarCursorDate)}')" class="lime-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm inline-flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i><span>${t('newShiftBtn')}</span></button>
      </div>
    </div>
    <div class="saas-card p-4 sm:p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div class="flex items-center gap-2">
          <button onclick="moveCalendar(-1)" class="w-9 h-9 rounded-full bg-[#1a202c] hover:bg-[#232b3b] border border-[#232936] flex items-center justify-center text-slate-200"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <div class="text-base sm:text-lg font-bold text-white capitalize min-w-[140px] text-center">${escapeHTML(monthTitle)}</div>
          <button onclick="moveCalendar(1)" class="w-9 h-9 rounded-full bg-[#1a202c] hover:bg-[#232b3b] border border-[#232936] flex items-center justify-center text-slate-200"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          <button onclick="calendarCursorDate=new Date();renderCurrentView();" class="px-3 py-1.5 rounded-full bg-[#1a202c] hover:bg-[#232b3b] border border-[#232936] text-xs font-semibold text-slate-200">${t('todayBtn')}</button>
        </div>
        <div class="inline-flex rounded-full bg-[#0d0f14] p-1 border border-[#232936]">
          ${['month','week','day'].map((v,i)=>`<button onclick="calendarViewMode='${v}';renderCurrentView();" class="px-3.5 py-1 rounded-full text-xs font-semibold ${calendarViewMode===v?'bg-[#d4f824] text-[#0d0f14]':'text-[#8892a4] hover:text-white'}">${[t('viewMonth'),t('viewWeek'),t('viewDay')][i]}</button>`).join('')}
        </div>
      </div>
      ${gridHtml}
    </div>
  </div>`;
}

function moveCalendar(delta) {
  const d = new Date(calendarCursorDate);
  if(calendarViewMode==='month') d.setMonth(d.getMonth()+delta);
  else if(calendarViewMode==='week') d.setDate(d.getDate()+delta*7);
  else d.setDate(d.getDate()+delta);
  calendarCursorDate=d; renderCurrentView();
}

function openShiftModal(shiftId=null, defaultDate=toISODate(new Date())) {
  const existing = shiftId ? state.shifts.find(s=>s.id===shiftId) : null;
  const sh = existing || { id:'', date:defaultDate, typeId:'morning', start:'08:00', end:'14:00', location:state.profile.department||'', notes:'', color:'' };
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-bold text-white">${existing?'Modifica turno':'Nuovo turno'}</h3>
      <button onclick="closeModal()" class="text-[#8892a4] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form onsubmit="saveShiftForm(event,'${existing?existing.id:''}')" class="space-y-3.5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Data</label><input name="date" type="date" required value="${sh.date}" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>

function onShiftTypeChange(typeId) {
  const st=getShiftType(typeId); if(!st) return;
  const si=document.getElementById('shift-start-input'), ei=document.getElementById('shift-end-input');
  if(si&&st.defaultStart!==undefined) si.value=st.defaultStart;
  if(ei&&st.defaultEnd!==undefined) ei.value=st.defaultEnd;
}
function saveShiftForm(e, existingId) {
  e.preventDefault();
  const fd=new FormData(e.target);
  const base={ id:existingId||('sh_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)), date:fd.get('date'), typeId:fd.get('typeId'), start:fd.get('start')||'', end:fd.get('end')||'', location:(fd.get('location')||'').trim(), notes:(fd.get('notes')||'').trim(), color:fd.get('color')||'' };
  if(existingId) { state.shifts=state.shifts.map(s=>s.id===existingId?base:s); }
  else {
    state.shifts.push(base);
    if(fd.get('recurring')==='on') {
      const every=Math.max(1,Number(fd.get('repeatEveryDays'))||7), count=Math.min(31,Math.max(1,Number(fd.get('repeatCount'))||4));
      const startObj=new Date(`${base.date}T12:00:00`);
      for(let i=1;i<=count;i++){
        const nd=new Date(startObj.getFullYear(),startObj.getMonth(),startObj.getDate()+i*every);
        state.shifts.push({...base,id:'sh_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5),date:toISODate(nd)});
      }
    }
  }
  saveState(); closeModal(); renderCurrentView(); showToast('Turno salvato.');
}
function deleteShift(id) { state.shifts=state.shifts.filter(s=>s.id!==id); saveState(); closeModal(); renderCurrentView(); showToast('Turno eliminato.'); }
function duplicateShiftNextDay(id) {
  const orig=state.shifts.find(s=>s.id===id); if(!orig) return;
  const dt=new Date(`${orig.date}T12:00:00`); dt.setDate(dt.getDate()+1);
  state.shifts.push({...orig,id:'sh_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),date:toISODate(dt)});
  saveState(); closeModal(); renderCurrentView(); showToast('Turno copiato al giorno successivo.');
}

function setImportStatus(msg) {

}
function showExtractedDebugText(text) {
  const box=document.getElementById('import-debug-box'), pre=document.getElementById('import-debug-pre');
  if(!box||!pre) return;
  if(text?.trim()) { box.classList.remove('hidden'); pre.textContent=text.trim(); } else { box.classList.add('hidden'); }
}
function handleFileDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('border-[#d4f824]'); const f=e.dataTransfer?.files?.[0]; if(f) processUploadedFile(f); }
function handleFileInputChange(e) { const f=e.target?.files?.[0]; if(f) processUploadedFile(f); e.target.value=''; }
function readFileAsDataURL(file) { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||'')); r.onerror=()=>rej(new Error('Errore lettura file')); r.readAsDataURL(file); }); }

async function processUploadedFile(file) {
  const targetName=(document.getElementById('import-target-name')?.value||'').trim();
  setImportStatus(`Analisi di "${file.name}" in corso...`);
  try {
    let extractedText='', collectedLines=[], imageBase64='', imageMimeType='';
    const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
    if(isPdf) {
      if(!window.pdfjsLib) throw new Error('PDF.js non disponibile.');
      const ab=await file.arrayBuffer(), pdf=await pdfjsLib.getDocument({data:ab}).promise, pages=[];
      for(let p=1;p<=pdf.numPages;p++) {
        const page=await pdf.getPage(p), content=await page.getTextContent();
        const rawItems=content.items.map(it=>({str:String(it.str||'').trim(),x:Math.round(it.transform[4]),y:Math.round(it.transform[5]),w:Math.round(it.width||0)})).filter(it=>it.str.length>0);
        rawItems.sort((a,b)=>Math.abs(b.y-a.y)>4?b.y-a.y:a.x-b.x);
        const linesMap=[];
        rawItems.forEach(item=>{ const found=linesMap.find(l=>Math.abs(l.y-item.y)<=5); if(found) found.items.push(item); else linesMap.push({y:item.y,items:[item]}); });
        linesMap.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
        let pageLines=linesMap.map(l=>{
          const mergedCells=[];
          l.items.forEach(cell=>{
            const prev=mergedCells[mergedCells.length-1];
            if(prev&&(cell.x-(prev.x+prev.w))<=10){prev.str=`${prev.str} ${cell.str}`.trim();prev.w=(cell.x+cell.w)-prev.x;}
            else{mergedCells.push({...cell});}
          });
          return{page:p,y:l.y-(p-1)*2000,rawY:l.y,text:mergedCells.map(c=>c.str).join(' | '),cells:mergedCells};
        });
        let pageText=pageLines.map(l=>l.text).join('\n');
        if(p===1&&state.aiConfig?.apiKey&&state.aiConfig.provider==='gemini') {
          const vp=page.getViewport({scale:1.6}), cv=document.createElement('canvas');
          cv.width=vp.width; cv.height=vp.height;
          await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
          imageBase64=cv.toDataURL('image/jpeg',0.85).split(',')[1]; imageMimeType='image/jpeg';
        }
        if(pageText.replace(/\s+/g,'').length<25&&window.Tesseract&&!imageBase64) {
          setImportStatus(`OCR pagina ${p}/${pdf.numPages}...`);
          const vp=page.getViewport({scale:2.0}), cv=document.createElement('canvas');
          cv.width=vp.width; cv.height=vp.height;
          await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
          const ocrRes=await Tesseract.recognize(cv,'ita');
          pageText=(ocrRes?.data?.text)||'';
          pageLines=pageText.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map((txt,idx)=>({page:p,y:-(p-1)*2000-idx*10,rawY:-idx*10,text:txt,cells:[]}));
        }
        collectedLines.push(...pageLines); pages.push(pageText);
      }
      extractedText=pages.join('\n');
    } else {
      if(state.aiConfig?.apiKey&&state.aiConfig.provider==='gemini') {
        const du=await readFileAsDataURL(file); imageBase64=du.split(',')[1]; imageMimeType=file.type||'image/jpeg';
      }
      if(!imageBase64&&window.Tesseract) {
        setImportStatus('OCR immagine in corso...');
        const result=await Tesseract.recognize(file,'ita');
        extractedText=(result?.data?.text)||'';
        collectedLines=extractedText.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map((txt,i)=>({page:1,y:-i*10,rawY:-i*10,text:txt,cells:[]}));
      }
    }
    let rows=[];
    if(state.aiConfig?.apiKey||state.aiConfig?.provider==='ollama') {
      setImportStatus(`Analisi IA (${state.aiConfig.provider.toUpperCase()}) in corso...`);
      rows=await analyzeWithExternalAI({extractedText,imageBase64,imageMimeType,targetName});
    } else {
      setImportStatus(`IA locale: analisi spaziale...`);
      rows=await smartLocalNeuralTurnParser(collectedLines,extractedText,targetName);
    }
    pendingExtractedRows=rows;
    showExtractedDebugText(extractedText||(imageBase64?'[Immagine inviata alla visione IA]':''));
    state.importedDocs.unshift({id:'doc_'+Date.now(),name:file.name,date:toISODate(new Date()),importedCount:rows.length,extractedText:(extractedText||'[IA visione]').slice(0,8000)});
    saveState();
    setImportStatus(`Analisi completata: ${rows.length} voci individuate.`);
    renderImportPreviewList(); if(window.lucide) lucide.createIcons();
  } catch(err) { console.error(err); setImportStatus(`Errore: ${err.message||'sconosciuto'}.`); }
}

async function parseManualTextInput() {
  const raw=(document.getElementById('import-raw-text')?.value||'').trim();
  const targetName=(document.getElementById('import-target-name')?.value||'').trim();
  if(!raw) { showToast('Inserisci del testo da analizzare.'); return; }
  try {
    if(state.aiConfig?.apiKey||state.aiConfig?.provider==='ollama') {
      setImportStatus(`IA (${state.aiConfig.provider}) in corso...`);
      pendingExtractedRows=await analyzeWithExternalAI({extractedText:raw,imageBase64:'',imageMimeType:'',targetName});
    } else {
      setImportStatus('IA locale in corso...');
      const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((txt,i)=>({page:1,y:-i*10,rawY:-i*10,text:txt,cells:[]}));
      pendingExtractedRows=await smartLocalNeuralTurnParser(lines,raw,targetName);
    }
    showExtractedDebugText(raw);
    setImportStatus(`Analisi completata: ${pendingExtractedRows.length} voci.`);
    renderImportPreviewList(); if(window.lucide) lucide.createIcons();
  } catch(err) { setImportStatus(`Errore: ${err.message}`); }
}

async function analyzeWithExternalAI({extractedText,imageBase64,imageMimeType,targetName}) {
  const cfg=state.aiConfig||{}; const yr=new Date().getFullYear(), mo=String(new Date().getMonth()+1).padStart(2,'0');
  const prompt=`Sei un assistente specializzato nell'estrazione di prospetti turni lavorativi italiani.\nAnalizza il documento.\n${targetName?`FILTRO: Estrai SOLO i turni di "${targetName}".`:''}\nAnno default: ${yr}, mese default: ${mo}.\nRestituisci SOLO un array JSON valido (senza markdown), ogni elemento:\n{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","kind":"shift|absence","typeId":"morning|afternoon|night|rest|overtime|other","absenceCategory":"ferie|permesso|malattia","note":"..."}\n\nTesto:\n${extractedText||'(nessun testo, leggi dall\'immagine)'}`;
  let raw='';
  if(cfg.provider==='gemini') {
    const model=cfg.model||'gemini-2.5-flash';
    const parts=[{text:prompt}];
    if(imageBase64) parts.push({inline_data:{mime_type:imageMimeType||'image/jpeg',data:imageBase64}});
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})});
    if(!res.ok) throw new Error(`Gemini ${res.status}: ${(await res.text()).slice(0,180)}`);
    const d=await res.json(); raw=d?.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
  } else if(cfg.provider==='openai') {
    const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},body:JSON.stringify({model:cfg.model||'gpt-4o-mini',temperature:0.1,messages:[{role:'user',content:prompt}]})});
    if(!res.ok) throw new Error(`OpenAI ${res.status}`);
    const d=await res.json(); raw=d?.choices?.[0]?.message?.content||'[]';
  } else if(cfg.provider==='ollama') {
    const ep=(cfg.customEndpoint||'http://localhost:11434/api/generate').trim();
    const res=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:cfg.model||'llama3.2',prompt,stream:false,format:'json'})});
    if(!res.ok) throw new Error(`Ollama ${res.status}`);
    const d=await res.json(); raw=d?.response||'[]';
  }
  const list=JSON.parse(raw.replace(/```json|```/gi,'').trim());
  const arr=Array.isArray(list)?list:(Array.isArray(list?.shifts)?list.shifts:[]);
  const rows=[]; const validTypes=['morning','afternoon','night','rest','overtime','other'];
  arr.forEach((item,idx)=>{
    if(!item?.date||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)) return;
    const start=/^\d{2}:\d{2}$/.test(item.start)?item.start:'', end=/^\d{2}:\d{2}$/.test(item.end)?item.end:'';
    const kind=item.kind==='absence'?'absence':'shift';
    const typeId=validTypes.includes(item.typeId)?item.typeId:'other';
    const absenceCategory=['ferie','permesso','malattia'].includes(item.absenceCategory)?item.absenceCategory:'ferie';
    const dup=state.shifts.some(s=>s.date===item.date&&(s.start||'')===start&&(s.end||'')===end);
    rows.push({tempId:'ai_'+idx+'_'+Math.random().toString(36).slice(2,6),kind,date:item.date,start,end,typeId,absenceCategory,note:String(item.note||'').slice(0,160),duplicate:dup,selected:!dup});
  });
  return rows;
}

// Local AI helpers
function normalizeForMatch(str) { return String(str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function lineMatchesTargetName(line,targetName) {
  const ct=normalizeForMatch(targetName); if(!ct) return true;
  const cl=normalizeForMatch(line); if(!cl) return false;
  const toks=ct.split(' ').filter(t=>t.length>=2); if(!toks.length) return false;
  return toks.every(tok=>new RegExp(`(^|\\s)${escapeRegex(tok)}(\\s|$)`,'i').test(cl)||(tok.length>=4&&cl.includes(tok)));
}
function inferYearMonthFromContext(txt) {
  const now=new Date(); let year=now.getFullYear(), month=now.getMonth()+1;
  const ym=txt.match(/\b(20\d{2})\b/); if(ym) year=Number(ym[1]);
  const mn={gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12,gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12};
  const low=normalizeForMatch(txt);
  for(const[n,v] of Object.entries(mn)) { if(new RegExp(`(^|\\s)${n}(\\s|$)`,'i').test(low)){month=v;break;} }
  return {year,month};
}
function parseTimeRangeFromText(seg) {
  const r=seg.match(/\b(\d{1,2}[:.]\d{2})\s*(?:[-–—\/→]|alle?|a|fino\s+alle?)\s*(\d{1,2}[:.]\d{2})\b/i);
  if(r) { const n=s=>{ const c=s.replace('.',':'); const[h,m]=c.split(':'); return`${String(Number(h)).padStart(2,'0')}:${m}`; }; return{start:n(r[1]),end:n(r[2])}; }
  if(/\b(mattin\w*|matt\.?)\b/i.test(seg)&&!/\d{1,2}[:.]\d{2}/.test(seg)) return{start:'08:00',end:'14:00'};
  if(/\b(pomerig\w*|pom\.?)\b/i.test(seg)&&!/\d{1,2}[:.]\d{2}/.test(seg)) return{start:'14:00',end:'20:00'};
  if(/\b(nott\w*)\b/i.test(seg)&&!/\d{1,2}[:.]\d{2}/.test(seg)) return{start:'22:00',end:'06:00'};
  return{start:'',end:''};
}
function classifySegmentDetails(seg) {
  const{start,end}=parseTimeRangeFromText(seg); const low=seg.toLowerCase();
  let kind='shift',typeId='other',absenceCategory='ferie';
  if(/\b(ripos\w*|recuper\w*|permess\w*|rol)\b/i.test(low)){kind='absence';absenceCategory='permesso';}
  else if(/\b(malatt\w*|infortun\w*)\b/i.test(low)){kind='absence';absenceCategory='malattia';}
  else if(/\b(ferie|licenz\w*|conged\w*)\b/i.test(low)){kind='absence';absenceCategory='ferie';}
  else if(/\b(ripos\w*|libero|off)\b/i.test(low)) typeId='rest';
  else if(/\b(straordin\w*)\b/i.test(low)) typeId='overtime';
  else if(/\b(mattin\w*|matt\.?)\b/i.test(low)) typeId='morning';
  else if(/\b(pomerig\w*|pom\.?)\b/i.test(low)) typeId='afternoon';
  else if(/\b(nott\w*)\b/i.test(low)) typeId='night';
  if(kind==='shift'&&typeId==='other'&&start){const h=Number(start.split(':')[0]);typeId=h>=5&&h<12?'morning':h>=12&&h<19?'afternoon':'night';}
  return{start,end,kind,typeId,absenceCategory};
}
function resolveDateFromTokens(dayStr,monthStr,yearStr,ctxYear,ctxMonth) {
  const d=Number(dayStr); if(!d||d<1||d>31) return '';
  const m=monthStr?Number(monthStr):ctxMonth; if(!m||m<1||m>12) return '';
  let y=yearStr?Number(yearStr):ctxYear; if(y<100) y+=2000;
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return '';
  return toISODate(dt);
}

async function smartLocalNeuralTurnParser(structuredLines,rawText,targetName='') {
  const spatial=localAITurnParser(structuredLines,rawText,targetName);
  if(spatial.length>0) return spatial;
  if(!window.RitmoLocalAI||!rawText||rawText.trim().length<8) return [];
  try {
    setImportStatus('Caricamento modello neurale IA locale...');
    const extractor=await window.RitmoLocalAI.getExtractor();
    const{year:cy,month:cm}=inferYearMonthFromContext(rawText);
    const lines=rawText.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const ct=normalizeForMatch(targetName);
    let snippet='';
    if(ct) { const p=[]; for(let i=0;i<lines.length;i++){if(lineMatchesTargetName(lines[i],ct)){p.push(lines.slice(Math.max(0,i-1),Math.min(lines.length,i+8)).join(' ; '));}} snippet=p.join('\n').slice(0,1400); }
    else { snippet=lines.join('\n').slice(0,1400); }
    if(!snippet) return [];
    setImportStatus('Analisi semantica neurale in corso...');
    const out=await extractor(`Extract work shifts${targetName?' ONLY for '+targetName:''} from this schedule (month ${cm}/${cy}). Format per shift: YYYY-MM-DD | HH:MM-HH:MM | TYPE. Text:\n${snippet}`,{max_new_tokens:220,temperature:0.1});
    const gen=(out?.[0]?.generated_text)||'';
    if(!gen) return [];
    const synthLines=gen.split(/\r?\n|;/).map(s=>s.trim()).filter(Boolean).map((txt,i)=>({page:1,y:-i*10,rawY:-i*10,text:txt,cells:[]}));
    return localAITurnParser(synthLines,gen,'');
  } catch(err) { console.warn('Neural fallback unavailable:',err); return []; }
}

function looksLikeAnotherPersonOrHeader(line,targetName) {
  const ct=normalizeForMatch(targetName); if(!ct) return false;
  if(lineMatchesTargetName(line,ct)) return false;
  const cleaned=line.trim(); if(!cleaned) return false;
  if(/^(dipendente|operatore|nominativo|addetto|risorsa|cognome|nome|matricola|sig\.?|dott\.?)\b/i.test(cleaned)) return true;
  if(/\b[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]{2,},\s*[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]{2,}\b/.test(cleaned)||
     /\b[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]{2,}\s+[A-ZÀ-ÖØ-Þ][a-zà-öø-ÿ]{2,}\b/.test(cleaned)||
     /\b[A-ZÀ-ÖØ-Þ]{3,}\s+[A-ZÀ-ÖØ-Þ]{3,}\b/.test(cleaned)) return true;
  return false;
}

function localAITurnParser(structuredLines,rawText,targetName='') {
  const rows=[], ct=normalizeForMatch(targetName);
  const{year:ctxYear,month:ctxMonth}=inferYearMonthFromContext(rawText);
  const isShiftMeaningful=s=>{if(!s)return false;const{start}=parseTimeRangeFromText(s);if(start)return true;return/\b(mattin\w*|matt\.?|pomerig\w*|pom\.?|nott\w*|ripos\w*|libero|off|r\.?o\.?|rip\.?|ferie|licenz\w*|conged\w*|permess\w*|rol|recuper\w*|malatt\w*|straordin\w*|str\.?|[mpn]\d{0,2})\b/i.test(s);};
  const addRow=(isoDate,segText)=>{
    if(!isoDate||!isShiftMeaningful(segText)) return;
    const{start,end,kind,typeId,absenceCategory}=classifySegmentDetails(segText);
    const dup=state.shifts.some(s=>s.date===isoDate&&(s.start||'')===start&&(s.end||'')===end)||rows.some(r=>r.kind===kind&&r.date===isoDate&&(r.start||'')===start&&(r.end||'')===end);
    rows.push({tempId:'row_'+rows.length+'_'+Math.random().toString(36).slice(2,6),kind,date:isoDate,start,end,typeId,absenceCategory,note:segText.replace(/\s+/g,' ').trim().slice(0,160),duplicate:dup,selected:!dup});
  };

  // Strategy A: Employee name in column header (X), days down rows (Y)
  if(ct){
    const targetHeaderCells=[], allPersonHeaderCells=[];
    structuredLines.forEach(ln=>{
      if(!ln.cells||ln.cells.length<2) return;
      ln.cells.forEach(c=>{
        if(lineMatchesTargetName(c.str,ct)){
          targetHeaderCells.push({page:ln.page||1,y:ln.y,x:c.x,w:c.w||40,str:c.str});
        } else if(/^[A-ZÀ-ÖØ-Þa-zà-öø-ÿ]{3,}(?:[\s,]+[A-ZÀ-ÖØ-Þa-zà-öø-ÿ]{2,})*$/.test(c.str.trim())&&!/^(lun|mar|mer|gio|ven|sab|dom|data|giorno|turno|orario|note|reparto|totale|ore|mese|anno)/i.test(c.str.trim())){
          allPersonHeaderCells.push({page:ln.page||1,y:ln.y,x:c.x,w:c.w||40,str:c.str});
        }
      });
    });
    if(targetHeaderCells.length>0){
      targetHeaderCells.forEach(anchor=>{
        const others=allPersonHeaderCells.filter(c=>c.page===anchor.page&&Math.abs(c.y-anchor.y)<=16);
        let minX=anchor.x-35, maxX=anchor.x+Math.max(85,anchor.w+35);
        others.forEach(o=>{
          if(o.x<anchor.x) minX=Math.max(minX,(o.x+(o.w||30)+anchor.x)/2);
          else if(o.x>anchor.x) maxX=Math.min(maxX,(o.x+anchor.x+(o.w||30))/2);
        });
        let activeDate='';
        structuredLines.forEach(ln=>{
          if((ln.page||1)!==anchor.page||ln.y>=anchor.y-4) return;
          let rowIso='';
          const fdm=ln.text.match(/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-]\s*(\d{2,4}))?\b/);
          const dlc=(ln.cells||[]).find(c=>c.x<minX&&/^(?:lun|mar|mer|gio|ven|sab|dom)?[a-zà-ù.]*\s*(\d{1,2})\b/i.test(c.str.trim()));
          if(fdm) rowIso=resolveDateFromTokens(fdm[1],fdm[2],fdm[3],ctxYear,ctxMonth);
          else if(dlc) rowIso=resolveDateFromTokens(dlc.str.trim().match(/(\d{1,2})/)[1],ctxMonth,ctxYear,ctxYear,ctxMonth);
          if(rowIso) activeDate=rowIso;
          if(!activeDate) return;
          const myCells=(ln.cells||[]).filter(c=>{const cx=c.x+(c.w||0)/2;return cx>=minX&&cx<=maxX&&!lineMatchesTargetName(c.str,ct);});
          if(myCells.length>0){
            const cc=myCells.map(c=>c.str).join(' ').trim();
            if(cc&&!/^[-/._\s]+$/.test(cc)) addRow(activeDate,cc);
          }
        });
      });
      if(rows.length>0) return rows;
    }
  }

  // Strategy B: Days (1..31) across columns (X), employee name on row (Y)
  const headerCandidates=structuredLines.filter(ln=>ln.cells&&ln.cells.length>=4&&ln.cells.filter(c=>/^(?:lun|mar|mer|gio|ven|sab|dom)?\s*(?:0?[1-9]|[12]\d|3[01])(?:\s*[a-z]{2,4})?$/i.test(c.str.trim())).length>=4);
  if(headerCandidates.length>0&&ct){
    headerCandidates.forEach(hdr=>{
      const dayColumns=hdr.cells.filter(c=>/^(?:lun|mar|mer|gio|ven|sab|dom)?\s*(?:0?[1-9]|[12]\d|3[01])(?:\s*[a-z]{2,4})?$/i.test(c.str.trim())).map(c=>{
        const dn=c.str.trim().match(/(\d{1,2})/)[1];
        return{day:Number(dn),x:c.x+(c.w||0)/2,iso:resolveDateFromTokens(dn,ctxMonth,ctxYear,ctxYear,ctxMonth)};
      }).filter(col=>Boolean(col.iso));
      for(let idx=0;idx<structuredLines.length;idx++){
        const ln=structuredLines[idx];
        if(ln===hdr||(ln.page||1)!==(hdr.page||1)||!ln.cells?.length) continue;
        if(!lineMatchesTargetName(ln.text,ct)) continue;
        const candRows=[ln], nextLn=structuredLines[idx+1];
        if(nextLn&&(nextLn.page||1)===(ln.page||1)&&Math.abs(ln.y-nextLn.y)<=18&&!looksLikeAnotherPersonOrHeader(nextLn.text,ct)) candRows.push(nextLn);
        const matched=new Map();
        candRows.forEach(rl=>(rl.cells||[]).forEach(cell=>{
          if(lineMatchesTargetName(cell.str,ct)) return;
          const cx=cell.x+(cell.w||0)/2; let best=null, distMin=42;
          dayColumns.forEach(col=>{const d=Math.abs(cx-col.x);if(d<distMin){distMin=d;best=col;}});
          if(best) matched.set(best.iso,`${matched.get(best.iso)||''} ${cell.str}`.trim());
        }));
        matched.forEach((val,iso)=>{if(val&&!/^[-/._\s]+$/.test(val))addRow(iso,val);});
      }
    });
    if(rows.length>0) return rows;
  }

  // Strategy C: line-by-line with target isolation
  const expanded=[];
  structuredLines.forEach(ln=>ln.text.split(/\s+[·|]\s+/).forEach(p=>{if(p.trim())expanded.push(p.trim());}));
  if(ct&&!expanded.some(l=>lineMatchesTargetName(l,ct))) return [];

  let activeSection=!ct, currentDate='';
  expanded.forEach(line=>{
    const dateRegex=/\b(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-]\s*(\d{2,4}))?\b/g;
    const directMatch=ct?lineMatchesTargetName(line,ct):true;
    const wdMatch=line.match(/\b(?:lun(?:edi|\.)?|mar(?:tedi|\.)?|mer(?:coledi|\.)?|gio(?:vedi|\.)?|ven(?:erdi|\.)?|sab(?:ato|\.)?|dom(?:enica|\.)?)\s+(\d{1,2})\b/i);
    if(ct){
      if(directMatch) activeSection=true;
      else if(looksLikeAnotherPersonOrHeader(line,ct)) { activeSection=false; return; }
      else if(!activeSection) return;
    }
    const matches=[...line.matchAll(dateRegex)];
    if(matches.length>1){
      matches.forEach((m,i)=>{
        const end=i+1<matches.length?matches[i+1].index:line.length;
        const seg=line.slice(m.index,end).trim();
        const iso=resolveDateFromTokens(m[1],m[2],m[3],ctxYear,ctxMonth);
        if(iso){currentDate=iso;addRow(iso,seg);}
      }); return;
    }
    if(matches.length===1){
      const m=matches[0], iso=resolveDateFromTokens(m[1],m[2],m[3],ctxYear,ctxMonth);
      if(iso) currentDate=iso;
      const rest=line.replace(m[0],'').trim();
      if(iso&&isShiftMeaningful(rest||line)) addRow(iso,rest||line);
      return;
    }
    if(wdMatch){
      const iso=resolveDateFromTokens(wdMatch[1],ctxMonth,ctxYear,ctxYear,ctxMonth);
      if(iso){currentDate=iso;const after=line.slice(wdMatch.index+wdMatch[0].length).trim();if(isShiftMeaningful(after))addRow(iso,after);}
      return;
    }
    if(currentDate&&isShiftMeaningful(line)) addRow(currentDate,line);
  });
  return rows;
}

function renderImportPreviewList() {
  const section=document.getElementById('import-preview-section'), list=document.getElementById('import-preview-list');
  if(!section||!list) return;
  section.classList.toggle('hidden',pendingExtractedRows.length===0);
  list.innerHTML=pendingExtractedRows.map(r=>`<div class="p-3 rounded-xl bg-[#11151d] border ${r.duplicate?'border-amber-500/40':'border-[#232936]'} flex flex-col gap-2.5 text-xs">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <label class="flex items-center gap-2 font-semibold text-white cursor-pointer">
        <input type="checkbox" ${r.selected?'checked':''} onchange="togglePreviewRow('${r.tempId}',this.checked)" class="rounded accent-[#d4f824]" />
        <span>${formatDateIT(r.date)}</span>
        ${r.duplicate?`<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px]">Duplicato</span>`:''}
      </label>
      <button onclick="removePreviewRow('${r.tempId}')" class="text-rose-400 hover:text-rose-300">Rimuovi</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
      <div><label class="block text-[10px] text-[#8892a4] mb-0.5">Data</label><input type="date" value="${r.date}" onchange="updatePreviewRowField('${r.tempId}','date',this.value)" class="w-full px-2 py-1.5 rounded-lg bg-[#0d0f14] border border-[#232936] text-xs text-white" /></div>
      <div><label class="block text-[10px] text-[#8892a4] mb-0.5">Inizio</label><input type="time" value="${r.start||''}" onchange="updatePreviewRowField('${r.tempId}','start',this.value)" class="w-full px-2 py-1.5 rounded-lg bg-[#0d0f14] border border-[#232936] text-xs text-white" /></div>
      <div><label class="block text-[10px] text-[#8892a4] mb-0.5">Fine</label><input type="time" value="${r.end||''}" onchange="updatePreviewRowField('${r.tempId}','end',this.value)" class="w-full px-2 py-1.5 rounded-lg bg-[#0d0f14] border border-[#232936] text-xs text-white" /></div>
      <div><label class="block text-[10px] text-[#8892a4] mb-0.5">Tipo</label>
        <select onchange="updatePreviewRowType('${r.tempId}',this.value)" class="w-full px-2 py-1.5 rounded-lg bg-[#0d0f14] border border-[#232936] text-xs text-white">
          ${state.shiftTypes.map(st=>`<option value="shift:${st.id}" ${r.kind==='shift'&&r.typeId===st.id?'selected':''}>${escapeHTML(st.label)}</option>`).join('')}
          <option value="absence:ferie" ${r.kind==='absence'&&r.absenceCategory==='ferie'?'selected':''}>Assenza: Ferie</option>
          <option value="absence:permesso" ${r.kind==='absence'&&r.absenceCategory==='permesso'?'selected':''}>Assenza: Permesso</option>
          <option value="absence:malattia" ${r.kind==='absence'&&r.absenceCategory==='malattia'?'selected':''}>Assenza: Malattia</option>
        </select>
      </div>
    </div>
    <div class="text-[11px] text-[#8892a4] truncate">${escapeHTML(r.note||'')}</div>
  </div>`).join('');
}
function updatePreviewRowField(id,field,val){const r=pendingExtractedRows.find(x=>x.tempId===id);if(r){r[field]=val;renderImportPreviewList();}}
function updatePreviewRowType(id,val){const r=pendingExtractedRows.find(x=>x.tempId===id);if(!r||!val)return;const[kind,sub]=val.split(':');r.kind=kind;if(kind==='absence')r.absenceCategory=sub;else r.typeId=sub;renderImportPreviewList();}
function togglePreviewRow(id,checked){const r=pendingExtractedRows.find(x=>x.tempId===id);if(r)r.selected=checked;}
function removePreviewRow(id){pendingExtractedRows=pendingExtractedRows.filter(r=>r.tempId!==id);renderImportPreviewList();}
function confirmImportedRows(){
  const sel=pendingExtractedRows.filter(r=>r.selected);
  if(!sel.length){showToast('Seleziona almeno una riga.');return;}
  let as=0,ab=0;
  sel.forEach(r=>{
    if(r.kind==='absence'){
      const catMap={ferie:'leave',permesso:'permit',malattia:'sick'};
      const mappedCat=catMap[r.absenceCategory]||r.absenceCategory||'leave';
      state.absences.push({id:'abs_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),category:mappedCat,type:r.absenceCategory==='permesso'?'Permesso / Recupero':r.absenceCategory==='malattia'?'Malattia':'Ferie',startDate:r.date,endDate:r.date,days:1,hours:0,notes:r.note||'Importato'});
      ab++;
    } else {
      state.shifts.push({id:'sh_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date:r.date,typeId:r.typeId||'other',start:r.start||'',end:r.end||'',location:state.profile.department||'',notes:r.note||'Importato',color:''});
      as++;
    }
  });
  pendingExtractedRows=[];saveState();renderCurrentView();showToast(`Importati ${as} turni e ${ab} assenze.`);
}
function inspectSavedDoc(docId){
  const doc=state.importedDocs.find(d=>d.id===docId);if(!doc)return;
  openModal(`<div class="flex items-center justify-between mb-3"><h3 class="text-base font-bold text-white truncate pr-2">${escapeHTML(doc.name)}</h3><button onclick="closeModal()" class="text-[#8892a4] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>

function renderAbsencesView() {
  const yr=new Date().getFullYear(), ya=state.absences.filter(a=>a.startDate?.startsWith(String(yr)));
  const leaveDays=ya.filter(a=>a.category==='leave').reduce((s,a)=>s+(Number(a.days)||1),0);
  const permitDays=ya.filter(a=>a.category==='permit').reduce((s,a)=>s+(Number(a.days)||1),0);
  const sickDays=ya.filter(a=>a.category==='sick').reduce((s,a)=>s+(Number(a.days)||1),0);
  const overtimeHrs=ya.filter(a=>a.category==='overtime').reduce((s,a)=>s+(Number(a.hours)||0),0);
  return `<div class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div><div class="text-[11px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('absEyebrow')}</div><h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${t('absTitle')}</h1></div>
      <button onclick="openAbsenceModal()" class="lime-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm inline-flex items-center gap-1.5 self-start sm:self-auto"><i data-lucide="plus" class="w-4 h-4"></i><span>${t('newAbsenceBtn')}</span></button>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${[[t('leaveCard'),'umbrella',leaveDays+' gg'],[t('permitCard'),'clock',permitDays+' gg'],[t('sickCard'),'heart-pulse',sickDays+' gg'],[t('overtimeCard'),'zap',formatHours(overtimeHrs)]].map(([l,ic,v])=>`<div class="saas-card p-4"><div class="flex items-center justify-between text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase"><span>${l}</span><i data-lucide="${ic}" class="w-3.5 h-3.5"></i></div><div class="text-2xl font-bold text-white mt-2">${v}</div></div>`).join('')}

        <div class="p-3.5 rounded-xl bg-[#11151d] border border-[#232936] flex items-center justify-between gap-3">
          <div><div class="text-sm font-semibold text-white">${escapeHTML(ab.type)}</div><div class="text-xs text-[#8892a4]">${formatDateIT(ab.startDate)}${ab.endDate&&ab.endDate!==ab.startDate?' → '+formatDateIT(ab.endDate):''} · ${ab.category==='overtime'?formatHours(ab.hours):(ab.days||1)+' gg'}</div></div>

function getFilteredExpenses(){
  return state.expenses.filter(exp=>{
    if(expenseFilterMonth&&exp.date&&!exp.date.startsWith(expenseFilterMonth)&&!exp.recurringMonthly) return false;
    if(expenseFilterCategory!=='ALL'&&exp.category!==expenseFilterCategory) return false;
    if(expenseSearchQuery.trim()){const q=expenseSearchQuery.trim().toLowerCase();if(!(exp.description||'').toLowerCase().includes(q)&&!(exp.category||'').toLowerCase().includes(q)) return false;}
    return true;
  });
}
function handleExpenseSearchInput(el){expenseSearchQuery=el.value;const c=document.getElementById('expenses-list-container');if(c)c.innerHTML=renderExpensesListHtml(getFilteredExpenses());}

  return `<div class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div><div class="text-[11px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('expEyebrow')}</div><h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${t('expTitle')}</h1></div>

      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('currYearCard')}</div><div class="text-2xl font-bold text-white mt-2">${formatCurrency(yt)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('filteredTotalCard')}</div><div class="text-2xl font-bold text-white mt-2">${formatCurrency(ft)}</div></div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">${state.shortcuts.map(sc=>`<button onclick="triggerShortcut('${sc.id}')" class="py-2.5 px-3.5 rounded-xl bg-[#11151d] hover:bg-[#19202c] border border-[#232936] hover:border-[#d4f824]/50 text-xs sm:text-sm font-semibold text-white transition-all">${escapeHTML(sc.label)}</button>`).join('')}</div>

      <button onclick="openSubscriptionModal()" class="lime-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm inline-flex items-center gap-1.5 self-start sm:self-auto"><i data-lucide="plus" class="w-4 h-4"></i><span>${t('newSubBtn')}</span></button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('monthlyCostCard')}</div><div class="text-2xl font-bold text-white mt-2">${formatCurrency(mc)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('yearlyCostCard')}</div><div class="text-2xl font-bold text-white mt-2">${formatCurrency(yc)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('statusCard')}</div><div class="text-2xl font-bold text-[#d4f824] mt-2">${active.length} ${t('activeCountLabel')}</div></div>
    </div>
    <div class="saas-card p-4 sm:p-5 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-base font-semibold text-white">${t('yourSubsTitle')}</h2>
        <div class="inline-flex rounded-lg bg-[#0d0f14] p-1 border border-[#232936] text-xs">
          ${[['ALL',t('allFilter'),''],['active',t('activeFilter'),'text-[#22c55e]'],['paused',t('pausedFilter'),'text-amber-300'],['cancelled',t('cancelledFilter'),'text-rose-300']].map(([v,l,c])=>`<button onclick="subscriptionStatusFilter='${v}';renderCurrentView();" class="px-2.5 py-1 rounded ${subscriptionStatusFilter===v?'bg-[#1f2736] font-semibold '+c:'text-[#8892a4]'}">${l}</button>`).join('')}

      ${list.length===0?`<div class="dashed-empty py-8 px-4 text-center"><div class="text-sm text-[#cbd5e1]">${t('noSubs')}</div><div class="text-xs text-[#8892a4] mt-1">${t('noSubsHint')}</div></div>`:`<div class="space-y-2">${list.map(sub=>`
        <div class="p-3.5 rounded-xl bg-[#11151d] border border-[#232936] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="text-sm font-semibold text-white flex items-center gap-2"><span>${escapeHTML(sub.name)}</span><span class="text-[10px] px-2 py-0.5 rounded-full ${sub.status==='active'?'bg-emerald-500/15 text-emerald-300':sub.status==='paused'?'bg-amber-500/15 text-amber-300':'bg-rose-500/15 text-rose-300'}">${sub.status}</span></div>
            <div class="text-xs text-[#8892a4]">${escapeHTML(sub.frequency||'monthly')} · Rinnovo: ${sub.nextDate?formatDateIT(sub.nextDate):'—'}</div>
          </div>
          <div class="flex items-center gap-2.5">
            <span class="text-sm font-bold text-white">${formatCurrency(sub.amount)}</span>
            <button onclick="cycleSubscriptionStatus('${sub.id}')" class="px-2.5 py-1 rounded-lg bg-[#1a202c] hover:bg-[#242c3d] text-xs text-slate-200">Stato</button>
            <button onclick="deleteSubscription('${sub.id}')" class="px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300 text-xs">${t('deleteBtn')}</button>

}
function openSubscriptionModal(){openModal(`<div class="flex items-center justify-between mb-4"><h3 class="text-lg font-bold text-white">Nuovo abbonamento</h3><button onclick="closeModal()" class="text-[#8892a4] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
<form onsubmit="saveSubscriptionForm(event)" class="space-y-3.5">
  <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Nome servizio</label><input name="name" type="text" required placeholder="Es. Netflix, Spotify..." class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Importo (€)</label><input name="amount" type="number" step="0.01" min="0.01" required class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
    <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Frequenza</label><select name="frequency" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white"><option value="monthly">Mensile</option><option value="quarterly">Trimestrale</option><option value="yearly">Annuale</option><option value="weekly">Settimanale</option></select></div>
  </div>

    <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Prossimo rinnovo</label><input name="nextDate" type="date" value="${toISODate(new Date())}" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
    <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Stato</label><select name="status" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white"><option value="active">Attivo</option><option value="paused">Sospeso</option><option value="cancelled">Disdetto</option></select></div>
  </div>
  <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">Note</label><input name="notes" type="text" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
  <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-[#1c222e] text-xs font-semibold text-slate-300">Annulla</button><button type="submit" class="lime-btn px-4 py-2 rounded-xl text-xs">Salva</button></div>
</form>`);}
function saveSubscriptionForm(e){e.preventDefault();const fd=new FormData(e.target);state.subscriptions.push({id:'sub_'+Date.now(),name:(fd.get('name')||'').trim(),amount:Number(fd.get('amount'))||0,frequency:fd.get('frequency')||'monthly',nextDate:fd.get('nextDate')||'',status:fd.get('status')||'active',notes:(fd.get('notes')||'').trim()});saveState();closeModal();renderCurrentView();showToast('Abbonamento salvato.');}
function cycleSubscriptionStatus(id){const o=['active','paused','cancelled'];state.subscriptions=state.subscriptions.map(s=>s.id!==id?s:{...s,status:o[(o.indexOf(s.status)+1)%o.length]});saveState();renderCurrentView();}
function deleteSubscription(id){state.subscriptions=state.subscriptions.filter(s=>s.id!==id);saveState();renderCurrentView();showToast('Abbonamento eliminato.');}

// ============================================================
// SUMMARY
// ============================================================
function renderSummaryView(){
  const now=new Date(),yr=now.getFullYear(),ti=getAnnualIncomeTotal(yr),te=getAnnualExpensesTotal(yr);
  const asc=state.subscriptions.filter(s=>s.status==='active'),asc12=asc.reduce((a,s)=>a+getSubscriptionMonthlyEquivalent(s),0)*12;
  const totOut=te+asc12,net=ti-totOut,sp=ti>0?Math.min(100,Math.round((totOut/ti)*100)):0;
  const m12=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),md=getMonthMetrics(d.getFullYear(),d.getMonth()),out=md.expenses+md.subscriptionsMonthly;m12.push({label:d.toLocaleDateString(state.lang==='en'?'en-US':'it-IT',{month:'short',year:'2-digit'}).replace('.',''),income:md.income,out,balance:md.income-out});}
  const max12=Math.max(100,...m12.map(x=>Math.max(x.income,x.out)));
  const catTot={};
  state.expenses.forEach(exp=>{
    if(!exp.date)return;const[ey,em]=exp.date.split('-').map(Number);const cat=exp.category||'Altro';
    if(exp.recurringMonthly){const cnt=ey<yr?12:ey===yr?Math.max(0,12-(em-1)):0;if(cnt>0)catTot[cat]=(catTot[cat]||0)+(Number(exp.amount)||0)*cnt;}
    else if(ey===yr)catTot[cat]=(catTot[cat]||0)+(Number(exp.amount)||0);
  });
  const cats=Object.entries(catTot).sort((a,b)=>b[1]-a[1]),maxCat=Math.max(1,...cats.map(x=>x[1]));
  return `<div class="space-y-5">
    <div><div class="text-[11px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('sumEyebrow')}</div><h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${t('sumTitle')}</h1></div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('yearIncomeCard')}</div><div class="text-xl sm:text-2xl font-bold text-[#22c55e] mt-2">${formatCurrency(ti)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('yearOutCard')}</div><div class="text-xl sm:text-2xl font-bold text-rose-400 mt-2">${formatCurrency(totOut)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('balanceCard')}</div><div class="text-xl sm:text-2xl font-bold ${net>=0?'text-[#22c55e]':'text-rose-400'} mt-2">${formatCurrency(net)}</div></div>
      <div class="saas-card p-4"><div class="text-[10px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('incomeSpentCard')}</div><div class="text-xl sm:text-2xl font-bold text-white mt-2">${sp}%</div></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      <div class="lg:col-span-7 saas-card p-4 sm:p-5">
        <div class="flex items-center justify-between mb-3"><h2 class="text-sm sm:text-base font-semibold text-white">${t('last12MonthsTitle')}</h2></div>
        <div class="h-48 flex items-end justify-between gap-1.5 pt-4 border-b border-[#232936] pb-2">
          ${m12.map(m=>{const hi=Math.max(2,Math.round((m.income/max12)*140)),ho=Math.max(2,Math.round((m.out/max12)*140));return`<div class="flex-1 flex flex-col items-center gap-1"><div class="w-full flex items-end justify-center gap-0.5 h-36"><div class="w-2 rounded-t bg-[#d4f824]" style="height:${hi}px"></div><div class="w-2 rounded-t bg-sky-400" style="height:${ho}px"></div></div><span class="text-[9px] text-[#8892a4] truncate max-w-full">${m.label}</span></div>`;}).join('')}
        </div>
      </div>
      <div class="lg:col-span-5 saas-card p-4 sm:p-5">
        <h2 class="text-sm sm:text-base font-semibold text-white mb-3">${t('expByCatTitle')}</h2>
        ${cats.length===0?`<div class="dashed-empty py-10 text-center text-xs text-[#8892a4]">${t('noExpYear')}</div>`:`<div class="space-y-3">${cats.map(([cat,val])=>{const p=Math.max(4,Math.round((val/maxCat)*100));return`<div><div class="flex justify-between text-xs mb-1"><span class="font-medium text-slate-200">${escapeHTML(cat)}</span><span class="font-semibold text-white">${formatCurrency(val)}</span></div><div class="w-full h-2 rounded-full bg-[#232936] overflow-hidden"><div class="h-full rounded-full bg-[#d4f824]" style="width:${p}%"></div></div></div>`;}).join('')}</div>`}
      </div>
    </div>
    <div class="saas-card p-4 sm:p-5">
      <div class="flex items-center justify-between mb-3"><h2 class="text-sm sm:text-base font-semibold text-white">${t('monthlyComparisonTitle')}</h2><span class="px-2.5 py-1 rounded-full bg-[#1a202c] border border-[#232936] text-[11px] text-slate-300">${t('last12MonthsBadge')}</span></div>
      ${m12.every(x=>x.income===0&&x.out===0)?`<div class="dashed-empty py-7 text-center text-xs text-[#8892a4]">${t('noMovementsYet')}</div>`:`<div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-[#232936] text-[#8892a4]"><th class="py-2 pr-3">MESE</th><th class="py-2 px-3">${t('incomeRow').toUpperCase()}</th><th class="py-2 px-3">${t('expensesRow').toUpperCase()}</th><th class="py-2 pl-3 text-right">SALDO</th></tr></thead><tbody>${m12.map(r=>`<tr class="border-b border-[#232936]/50"><td class="py-2.5 pr-3 font-semibold text-white uppercase">${r.label}</td><td class="py-2.5 px-3 text-[#22c55e] font-medium">${formatCurrency(r.income)}</td><td class="py-2.5 px-3 text-rose-400 font-medium">${formatCurrency(r.out)}</td><td class="py-2.5 pl-3 text-right font-bold ${r.balance>=0?'text-white':'text-rose-400'}">${formatCurrency(r.balance)}</td></tr>`).join('')}</tbody></table></div>`}
    </div>
  </div>`;
}

// ============================================================
function renderSettings(){
  const w=state.dashboardWidgets;
  return `<div class="space-y-5">
    <div><div class="text-[11px] font-semibold tracking-wider text-[#8892a4] uppercase">${t('cfgEyebrow')}</div><h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${t('cfgTitle')}</h1></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="saas-card p-5 space-y-3.5">
        <h2 class="text-base font-bold text-white">${t('profileBoxTitle')}</h2>
        <form onsubmit="saveProfileSettings(event)" class="space-y-3">
          <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">${t('profileNameLabel')}</label><input name="name" type="text" value="${escapeHTML(state.profile.name||currentUserId)}" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
          <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">${t('profileRoleLabel')}</label><input name="role" type="text" value="${escapeHTML(state.profile.role||'')}" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
          <div><label class="block text-xs font-semibold text-[#9aa4b6] mb-1">${t('profileDeptLabel')}</label><input name="department" type="text" value="${escapeHTML(state.profile.department||'')}" class="w-full px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" /></div>
          <button type="submit" class="lime-btn px-4 py-2 rounded-xl text-xs">${t('saveProfileBtn')}</button>
        </form>
      </div>
      <div class="saas-card p-5 space-y-3.5">
        <h2 class="text-base font-bold text-white">${t('dashCustTitle')}</h2>
        <p class="text-xs text-[#8892a4]">${t('dashCustSub')}</p>
        <div class="space-y-2">
          ${[['showKpis','KPI (saldo, ore, stipendio)'],['showShifts','Turni di oggi e prossimi'],['showReminders','Promemoria 24 ore'],['showBalanceChart','Bilancio e grafico 6 mesi'],['showBottomPanels','Pannelli inferiori (attività, rinnovi, assenze)']].map(([k,l])=>`<label class="flex items-center gap-3 cursor-pointer p-2 rounded-xl hover:bg-[#11151d]">
            <input type="checkbox" ${w[k]?'checked':''} onchange="toggleDashWidget('${k}',this.checked)" class="accent-[#d4f824]" />
            <span class="text-xs text-slate-200">${l}</span>
          </label>`).join('')}
        </div>
      </div>
    </div>
    <div class="saas-card p-5 space-y-3.5">
      <h2 class="text-base font-bold text-white">${t('catCustTitle')}</h2>
      <div class="flex gap-2">
        <input id="new-cat-input" type="text" placeholder="${t('newCatPlaceholder')}" class="flex-1 px-3 py-2 rounded-xl bg-[#0d0f14] border border-[#232936] text-sm text-white" />
        <button onclick="addExpenseCategory()" class="lime-btn px-4 py-2 rounded-xl text-xs">${t('addBtn')}</button>
      </div>
      <div class="flex flex-wrap gap-2">
        ${state.expenseCategories.map(c=>`<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#11151d] border border-[#232936] text-xs text-slate-200">
          <span>${escapeHTML(c)}</span>
          <button onclick="removeExpenseCategory('${escapeHTML(c)}')" class="text-rose-400 hover:text-rose-300 ml-1">×</button>
        </div>`).join('')}
      </div>
    </div>
    <div class="saas-card p-5 space-y-3.5">
      <h2 class="text-base font-bold text-white">${t('backupBoxTitle')}</h2>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportAllJson()" class="px-3.5 py-2 rounded-xl bg-[#1a202c] hover:bg-[#242c3d] border border-[#2d3748] text-xs font-semibold text-white">${t('exportAllJsonBtn')}</button>
        <button onclick="exportCsv()" class="px-3.5 py-2 rounded-xl bg-[#1a202c] hover:bg-[#242c3d] border border-[#2d3748] text-xs font-semibold text-white">${t('exportCsvBtn')}</button>
        <label class="px-3.5 py-2 rounded-xl bg-[#1a202c] hover:bg-[#242c3d] border border-[#2d3748] text-xs font-semibold text-white cursor-pointer">${t('restoreJsonBtn')}<input type="file" accept=".json" onchange="restoreJson(event)" class="hidden" /></label>
        <button onclick="resetProfileData()" class="px-3.5 py-2 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 text-xs font-semibold">${t('resetProfileBtn')}</button>
      </div>
      <p class="text-[11px] text-[#8892a4]">I dati vengono salvati localmente nel browser di questo dispositivo.</p>
    </div>
  </div>`;
}
function saveProfileSettings(e){e.preventDefault();const fd=new FormData(e.target);state.profile={...state.profile,name:(fd.get('name')||'').trim(),role:(fd.get('role')||'').trim(),department:(fd.get('department')||'').trim()};saveState();updateChromeLabels();showToast('Profilo salvato.');}
function toggleDashWidget(key,val){state.dashboardWidgets[key]=val;saveState();}
function addExpenseCategory(){const v=(document.getElementById('new-cat-input')?.value||'').trim();if(!v){showToast('Inserisci un nome categoria.');return;}if(state.expenseCategories.includes(v)){showToast('Categoria già presente.');return;}state.expenseCategories.push(v);saveState();renderCurrentView();showToast('Categoria aggiunta.');}
function removeExpenseCategory(cat){state.expenseCategories=state.expenseCategories.filter(c=>c!==cat);saveState();renderCurrentView();}
function exportAllJson(){const all={};getUsersIndex().forEach(u=>{try{all[u]=JSON.parse(localStorage.getItem(STORAGE_PREFIX+u)||'{}');}catch(_){}});const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ritmo_backup_${toISODate(new Date())}.json`;a.click();}
function exportCsv(){if(!state.expenses.length){showToast('Nessuna uscita da esportare.');return;}const rows=[['Data','Categoria','Importo','Descrizione','Ricorrente'],...state.expenses.map(e=>[e.date,e.category,e.amount,e.description||'',e.recurringMonthly?'Sì':'No'])];const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ritmo_uscite_${toISODate(new Date())}.csv`;a.click();}
function restoreJson(e){const f=e.target?.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(typeof data==='object'&&!Array.isArray(data)){Object.entries(data).forEach(([u,ud])=>{localStorage.setItem(STORAGE_PREFIX+u,JSON.stringify(ud));registerUserInIndex(u);});showToast('Backup ripristinato.');renderCurrentView();}else showToast('File JSON non valido.');}catch(_){showToast('Errore lettura JSON.');}};r.readAsText(f);}
function resetProfileData(){if(!confirm('Azzerare tutti i dati del profilo attivo? Questa operazione è irreversibile.'))return;state={lang:state.lang,...createEmptyUserState(currentUserId)};saveState();renderCurrentView();showToast('Dati azzerati.');}

(function init(){
  setupPWA();
  loadUserState(currentUserId);
  renderCurrentView();
})();
</script>
